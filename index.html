<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista</title>
<!-- La app es 100% local: no carga nada de afuera ni manda nada afuera.
     Esta política lo vuelve obligatorio a nivel del navegador. -->
<!-- La app no carga nada de afuera. La única salida permitida es la base de
     datos de la sincronización (Firebase), y solo si está configurada. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; connect-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lista">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-cart-180.png">
<link rel="icon" href="./icon-cart-180.png">
<style>
  :root{
    --bg:#0B0F14; --surface:#141B23; --surface2:#1B242E;
    --text:#E6EDF3; --muted:#78848F; --line:#222C36;
    --accent:#22C55E; --danger:#EF4444;
    --kb:0px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Pantalla fija: sin doble-tap para acercar, sin pellizco, sin que iOS
     agrande el texto solo. La app nunca cambia de escala. */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
  body{
    font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    /* sin el menú/lupa de iOS al dejar presionado: ese gesto aquí es "ordenar" */
    -webkit-touch-callout:none;
  }
  #app{
    position:fixed;top:0;left:0;right:0;bottom:var(--kb);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;padding:8px 12px 7px;
    border-bottom:1px solid var(--line);
  }
  .fila{display:flex;align-items:center;gap:8px}
  #tabs{display:flex;gap:4px;flex:1;background:var(--surface2);border-radius:11px;padding:3px}
  .tab{
    -webkit-appearance:none;appearance:none;border:0;background:transparent;
    color:var(--muted);font-family:inherit;font-weight:600;font-size:15px;
    letter-spacing:-.2px;flex:1;padding:8px 6px;border-radius:9px;
  }
  .tab.sel{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .sub{
    display:flex;align-items:baseline;gap:8px;
    padding:6px 6px 0;
  }
  #ver{color:#4E5A66;font-size:11px;letter-spacing:.4px;flex:0 0 auto}
  #count{color:var(--muted);font-size:13px;flex:1;text-align:right}
  .icon-btn{
    -webkit-appearance:none;appearance:none;border:0;background:var(--surface2);
    color:var(--text);width:34px;height:34px;border-radius:10px;
    font-size:16px;line-height:1;display:grid;place-items:center;
  }
  .icon-btn:active{background:#2A3641}

  /* ---------- list ---------- */
  #scroller{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #items{list-style:none;margin:0;padding:4px 0 0}

  .row{position:relative;overflow:hidden;background:var(--bg)}
  .row .bg{
    position:absolute;inset:0;background:var(--danger);
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:22px;color:#fff;font-size:19px;font-weight:600;
    /* solo existe mientras arrastras: si no, con alturas de píxel partido
       se asomaba un hilito rojo entre renglón y renglón */
    opacity:0;
  }
  .row.swipe .bg{opacity:1}
  .item{
    position:relative;background:var(--bg);
    display:flex;align-items:center;gap:11px;
    padding:10px 16px;border-bottom:1px solid var(--line);
    will-change:transform;
  }
  .item.snap{transition:transform .18s ease-out}

  /* producto "levantado" para ordenarlo (dejar presionado) */
  .row.drag{z-index:5;overflow:visible}
  .row.drag .item{
    background:var(--surface2);
    border-bottom-color:transparent;border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.55);
    transform:scale(1.02);
  }
  .txt{flex:1;min-width:0;word-break:break-word;font-size:15px}
  .flash{animation:flash .9s ease-out}
  @keyframes flash{0%{background:#1E3A2A}100%{background:var(--bg)}}

  /* zona vacía: tocar aquí abre el teclado */
  #tapzone{min-height:45vh}

  #empty{padding:70px 26px;text-align:center;color:var(--muted)}
  #empty .big{font-size:44px;margin-bottom:14px;opacity:.55}
  #empty .t{font-size:16px;color:#9AA6B1}
  #empty .s{font-size:14px;margin-top:6px}

  /* ---------- composer ---------- */
  #composer{
    flex:0 0 auto;display:flex;gap:10px;align-items:center;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);
  }
  #entry{
    flex:1;min-width:0;-webkit-appearance:none;appearance:none;
    background:var(--surface2);border:1px solid transparent;color:var(--text);
    border-radius:12px;padding:12px 14px;
    /* OJO: en atajo "font:400 17px/1.2 inherit" no vale — inherit no es una
       familia válida y el navegador descarta TODA la regla, dejando el campo
       en 13.3px. Y por debajo de 16px iOS hace zoom solo al tocarlo. */
    font-family:inherit;font-weight:400;font-size:17px;line-height:1.2;
    -webkit-user-select:text;user-select:text;
  }
  #entry:focus{outline:0;border-color:#2E3B47}
  #entry::placeholder{color:#5C6874}
  #add{
    -webkit-appearance:none;appearance:none;border:0;
    background:var(--accent);color:#062B14;
    width:46px;height:46px;border-radius:12px;
    font-size:27px;font-weight:400;line-height:1;
    display:grid;place-items:center;flex:0 0 auto;
  }
  #add:active{filter:brightness(.85)}
  #add[disabled]{background:var(--surface2);color:#4B5560}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:16px;right:16px;bottom:calc(var(--kb) + 76px + env(safe-area-inset-bottom));
    background:var(--surface2);border:1px solid var(--line);border-radius:13px;
    padding:13px 16px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transform:translateY(18px);opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;font-size:15px;
  }
  #toast.on{opacity:1;transform:none;pointer-events:auto}
  #toast .m{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #undo{
    -webkit-appearance:none;appearance:none;border:0;background:transparent;
    color:var(--accent);font-family:inherit;font-weight:600;font-size:15px;
    padding:4px 2px;flex:0 0 auto;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="fila">
      <div id="tabs">
        <button class="tab sel" type="button" data-tab="lista">Lista</button>
        <button class="tab" type="button" data-tab="pedidos">Pedidos</button>
        <button class="tab" type="button" data-tab="web">Web</button>
      </div>
      <button class="icon-btn" id="share" type="button" title="Compartir">&#8593;</button>
    </div>
    <div class="sub">
      <span id="ver">v1.06</span>
      <span id="count"></span>
    </div>
  </header>

  <div id="scroller">
    <ul id="items"></ul>
    <div id="tapzone"></div>
  </div>

  <form id="composer" autocomplete="off">
    <input id="entry" type="text" placeholder="Agregar producto…" maxlength="120"
           enterkeyhint="done" autocapitalize="sentences" autocorrect="off"
           autocomplete="off" spellcheck="false">
    <button id="add" type="submit" disabled>+</button>
  </form>
</div>

<div id="toast"><span class="m"></span><button id="undo" type="button">Deshacer</button></div>

<script>
(function(){
  "use strict";

  var $ = function(s){ return document.querySelector(s); };
  var items = $("#items"), entry = $("#entry"), addBtn = $("#add"),
      countEl = $("#count"), scroller = $("#scroller"), toast = $("#toast");

  /* ---------------- datos ----------------
     Todo lo que sale de localStorage se trata como sospechoso: puede venir
     corrupto, de una versión vieja o manipulado. Se sanea antes de usarlo,
     así un dato raro nunca deja la app trabada. */
  var MAXLEN = 120;

  function limpiarTexto(v){
    if (typeof v !== "string") return "";
    return v.replace(/[\u0000-\u001F\u007F]/g, "")   // caracteres de control
            .replace(/\s+/g, " ").trim().slice(0, MAXLEN);
  }

  function nuevoId(){
    return String(Date.now()) + Math.random().toString(36).slice(2,7);
  }

  function sanearNum(v){ return (typeof v === "number" && isFinite(v)) ? v : null; }

  function sanear(bruto){
    if (!Array.isArray(bruto)) return [];
    var limpio = [], i, o, t;
    for (i = 0; i < bruto.length && limpio.length < 2000; i++){
      o = bruto[i];
      if (!o || typeof o !== "object") continue;
      t = limpiarTexto(o.t);
      if (!t) continue;
      if (o.d === true) continue;      // versión vieja: ya estaba comprado, se descarta
      limpio.push({ id: (typeof o.id === "string" && o.id) ? o.id : nuevoId(), t: t });
    }
    return limpio;
  }

  /* ---------------- las dos pestañas ----------------
     Cada una guarda en su propia llave: nunca se mezclan. */
  var TABS = {
    lista: {
      llave: "lista.v1",
      llave2: "lista.v2",
      titulo: "Lista de compras",
      campo: "Agregar producto…",
      icono: "&#128722;",
      vacio: ["La lista está vacía", "Toca la pantalla y escribe"],
      cuenta: function(n){ return n + " por comprar"; }
    },
    pedidos: {
      llave: "pedidos.v1",
      llave2: "pedidos.v2",
      titulo: "Pedidos pendientes",
      campo: "Agregar pedido…",
      icono: "&#128230;",
      vacio: ["No hay pedidos pendientes", "Amazon, Temu, lo que esté en camino"],
      cuenta: function(n){ return n + " pendiente" + (n > 1 ? "s" : ""); }
    },
    web: {
      llave: "web.v1",
      llave2: "web.v2",
      titulo: "Lista web",
      campo: "Agregar link o cosa…",
      icono: "&#127760;",
      vacio: ["No hay nada guardado", "Toca la pantalla y escribe"],
      cuenta: function(n){ return n + " pendiente" + (n > 1 ? "s" : ""); }
    }
  };
  var TAB_KEY = "lista.tab";

  function cargar(llave){
    try { return sanear(JSON.parse(localStorage.getItem(llave))); } catch(e){ return []; }
  }

  /* v2: cada producto lleva ts (fecha del último cambio) y pos (su lugar en
     la lista), y cada pestaña guarda lápidas (del) de lo borrado. Con eso
     dos teléfonos pueden ponerse de acuerdo: por producto gana el cambio
     más reciente, y un borrado no "renace" en el otro lado. */
  function sanearItemsV2(bruto){
    if (!Array.isArray(bruto)) return [];
    var out = [], i, o, t;
    for (i = 0; i < bruto.length && out.length < 2000; i++){
      o = bruto[i];
      if (!o || typeof o !== "object") continue;
      t = limpiarTexto(o.t);
      if (!t) continue;
      out.push({
        id: (typeof o.id === "string" && o.id) ? o.id : nuevoId(),
        t: t,
        ts: sanearNum(o.ts) === null ? Date.now() : o.ts,
        pos: sanearNum(o.pos) === null ? out.length : o.pos
      });
    }
    return out;
  }
  function sanearDel(bruto){
    var out = {}, id, n = 0;
    if (!bruto || typeof bruto !== "object" || Array.isArray(bruto)) return out;
    for (id in bruto){
      if (n >= 4000) break;
      if (sanearNum(bruto[id]) !== null){ out[id] = bruto[id]; n++; }
    }
    return out;
  }
  function cargarTab(c){
    var v2 = null;
    try { v2 = JSON.parse(localStorage.getItem(c.llave2)); } catch(e){}
    if (v2 && typeof v2 === "object" && !Array.isArray(v2)){
      return { items: sanearItemsV2(v2.items), del: sanearDel(v2.del) };
    }
    var viejo = cargar(c.llave), items = [], i, ahora = Date.now();   // migración desde v1
    for (i = 0; i < viejo.length; i++) items.push({ id: viejo[i].id, t: viejo[i].t, ts: ahora, pos: i });
    return { items: items, del: {} };
  }

  var listas = { lista: cargarTab(TABS.lista), pedidos: cargarTab(TABS.pedidos), web: cargarTab(TABS.web) };
  var tabGuardada = localStorage.getItem(TAB_KEY);
  var activa = TABS[tabGuardada] ? tabGuardada : "lista";
  var cfg = TABS[activa];
  var data = listas[activa].items, delMap = listas[activa].del;

  function guardarTab(t){
    try { localStorage.setItem(TABS[t].llave2, JSON.stringify(listas[t])); }
    catch(e){ alert("No se pudo guardar en este dispositivo."); }
  }
  function save(){
    guardarTab(activa);
    pedirSync();
  }

  function verPestana(t){
    if (!TABS[t]) t = "lista";
    activa = t; cfg = TABS[t]; data = listas[t].items; delMap = listas[t].del;
    try { localStorage.setItem(TAB_KEY, t); } catch(e){}
    [].forEach.call(document.querySelectorAll(".tab"), function(b){
      var sel = b.getAttribute("data-tab") === t;
      b.classList.toggle("sel", sel);
      b.setAttribute("aria-selected", sel ? "true" : "false");
    });
    entry.placeholder = cfg.campo;
    papelera = null; toast.classList.remove("on"); clearTimeout(tmr);
    render();
    scroller.scrollTop = 0;
    abrirStream();               // el stream en vivo sigue a la pestaña activa
  }

  $("#tabs").addEventListener("click", function(ev){
    var b = ev.target.closest(".tab");
    if (b) verPestana(b.getAttribute("data-tab"));
  });
  /* cambiar de pestaña no cierra el teclado */
  $("#tabs").addEventListener("mousedown", function(ev){
    if (document.activeElement === entry) ev.preventDefault();
  });
  var norm = function(s){
    return String(s == null ? "" : s)
      .toLowerCase().normalize("NFD").replace(/[\u0300-\u036F]/g,"").replace(/\s+/g," ").trim();
  };

  /* ---------------- render ---------------- */
  var flashId = null;

  function render(){
    var i;
    items.innerHTML = "";

    if (!data.length){
      var e = document.createElement("div");
      e.id = "empty";
      e.innerHTML = '<div class="big">' + cfg.icono + '</div>' +
                    '<div class="t"></div><div class="s"></div>';
      e.querySelector(".t").textContent = cfg.vacio[0];
      e.querySelector(".s").textContent = cfg.vacio[1];
      items.appendChild(e);
    }

    for (i=0;i<data.length;i++) items.appendChild(rowFor(data[i]));

    countEl.textContent = data.length ? cfg.cuenta(data.length) : "";
    flashId = null;
  }

  function rowFor(it){
    var li = document.createElement("li");
    li.className = "row";

    var bg = document.createElement("div");
    bg.className = "bg"; bg.textContent = "Borrar";

    var d = document.createElement("div");
    d.className = "item" + (it.id === flashId ? " flash" : "");
    d.dataset.id = it.id;

    var txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = it.t;

    d.appendChild(txt);
    li.appendChild(bg); li.appendChild(d);
    return li;
  }

  /* ---------------- agregar ---------------- */
  function posTope(){
    var m = 0, i;
    for (i = 0; i < data.length; i++) if (data[i].pos < m) m = data[i].pos;
    return m - 1;
  }
  function posEntre(a, b){
    if (!a && !b) return 0;
    if (!a) return b.pos - 1;
    if (!b) return a.pos + 1;
    var m = (a.pos + b.pos) / 2;
    return (m > a.pos && m < b.pos) ? m : null;   // sin hueco entre vecinos
  }
  function renumerar(){
    var ahora = Date.now(), i;
    for (i = 0; i < data.length; i++){ data[i].pos = i; data[i].ts = ahora; }
  }

  function add(text){
    text = limpiarTexto(text);
    if (!text) return;
    var n = norm(text), i;

    for (i=0;i<data.length;i++){
      if (norm(data[i].t) === n){
        var it = data.splice(i,1)[0];   // ya existe: lo sube al tope
        it.pos = posTope(); it.ts = Date.now();
        data.unshift(it);
        flashId = it.id;
        save(); render(); scroller.scrollTop = 0;
        return;
      }
    }

    var nuevo = { id: nuevoId(), t: text, ts: Date.now(), pos: posTope() };
    data.unshift(nuevo);
    flashId = nuevo.id;
    save(); render(); scroller.scrollTop = 0;
  }

  function commit(){
    add(entry.value);
    entry.value = "";
    addBtn.disabled = true;
    entry.focus();                // el cursor nunca se va: el teclado sigue arriba
  }

  $("#composer").addEventListener("submit", function(ev){
    ev.preventDefault();          // no recarga la página
    commit();
  });

  entry.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" || ev.keyCode === 13){ ev.preventDefault(); commit(); }
  });

  addBtn.addEventListener("click", function(ev){
    ev.preventDefault();          // evita el submit doble
    commit();
  });

  entry.addEventListener("input", function(){
    addBtn.disabled = !entry.value.trim();
  });

  /* ------- tocar cualquier parte = abrir el teclado ------- */
  document.addEventListener("click", function(ev){
    if (ev.target.closest("button, input, .item, #ver")) return;
    entry.focus();
  });

  /* el teclado no se cierra al tocar la lista */
  items.addEventListener("mousedown", function(ev){
    if (document.activeElement === entry) ev.preventDefault();
  });

  /* ---------------- swipe para borrar ----------------
     Tocar un producto NO hace nada: la única forma de sacarlo de la lista
     es deslizarlo a la izquierda (con "Deshacer" por 5 segundos). Así un
     roce accidental no cambia nada. */
  var sx=0, sy=0, node=null, moving=false, lock=null;

  items.addEventListener("touchstart", function(ev){
    var el = ev.target.closest(".item");
    if (!el) return;
    node = el; node.classList.remove("snap");
    if (node.parentNode) node.parentNode.classList.add("swipe");
    sx = ev.touches[0].clientX; sy = ev.touches[0].clientY;
    moving = false; lock = null;
    /* dedo quieto medio segundo = levantar el producto para ordenarlo */
    clearTimeout(pressTmr);
    pressTmr = setTimeout(function(){
      if (node && lock === null) startDrag(node);
    }, 400);
  }, {passive:true});

  items.addEventListener("touchmove", function(ev){
    if (dragging){
      if (ev.cancelable) ev.preventDefault();     // el dedo mueve el producto, no la lista
      lastY = ev.touches[0].clientY;
      moveDrag(lastY);
      return;
    }
    if (!node) return;
    var dx = ev.touches[0].clientX - sx, dy = ev.touches[0].clientY - sy;
    if (lock === null){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      clearTimeout(pressTmr);                     // ya se movió: no es "dejar presionado"
      lock = (Math.abs(dx) > Math.abs(dy) + 4) ? "x" : "y";
    }
    if (lock !== "x") return;
    moving = true;
    if (ev.cancelable) ev.preventDefault();       // bloquea el scroll mientras arrastras
    node.style.transform = "translateX(" + Math.min(0, dx) + "px)";
  }, {passive:false});

  function endSwipe(ev){
    clearTimeout(pressTmr);
    if (dragging){ endDrag(); return; }
    if (!node) return;
    var el = node, dx = 0;
    if (ev.changedTouches && ev.changedTouches[0]) dx = ev.changedTouches[0].clientX - sx;
    node = null;

    if (lock === "x" && dx < -95){
      el.classList.add("snap");
      el.style.transform = "translateX(-100%)";
      remove(el.dataset.id);
      return;
    }
    el.classList.add("snap");
    el.style.transform = "";
    if (el.parentNode) el.parentNode.classList.remove("swipe");
  }
  items.addEventListener("touchend", endSwipe, {passive:true});
  items.addEventListener("touchcancel", endSwipe, {passive:true});

  /* ---------------- dejar presionado = ordenar ----------------
     Mantener el dedo quieto sobre un producto lo "levanta"; arrastrando
     hacia arriba o abajo cambia de lugar y al soltar se guarda el orden.
     Cerca del borde de la pantalla la lista se desplaza sola. */
  var pressTmr=null, dragging=false, dragRow=null, dragY0=0, lastY=0;

  function startDrag(el){
    var li = el.parentNode;
    if (!li || !li.classList.contains("row")) return;
    dragging = true; dragRow = li;
    node = null;                                  // este gesto ya no es swipe
    li.classList.remove("swipe");
    li.classList.add("drag");
    dragY0 = sy; lastY = sy;
    requestAnimationFrame(autoScroll);
  }

  function moveDrag(y){
    if (!dragRow) return;
    dragRow.style.transform = "translateY(" + (y - dragY0) + "px)";
    var r = dragRow.getBoundingClientRect(), c = r.top + r.height/2, v, vr;

    /* al cruzar la mitad del vecino, se intercambian de lugar; el ajuste a
       dragY0 compensa el brinco del DOM para que no se mueva bajo el dedo */
    v = dragRow.previousElementSibling;
    while (v && v.classList.contains("row")){
      vr = v.getBoundingClientRect();
      if (c >= vr.top + vr.height/2) break;
      items.insertBefore(dragRow, v);
      dragY0 -= vr.height;
      dragRow.style.transform = "translateY(" + (y - dragY0) + "px)";
      v = dragRow.previousElementSibling;
    }
    v = dragRow.nextElementSibling;
    while (v && v.classList.contains("row")){
      vr = v.getBoundingClientRect();
      if (c <= vr.top + vr.height/2) break;
      items.insertBefore(dragRow, v.nextSibling);
      dragY0 += vr.height;
      dragRow.style.transform = "translateY(" + (y - dragY0) + "px)";
      v = dragRow.nextElementSibling;
    }
  }

  function autoScroll(){
    if (!dragging) return;
    var r = scroller.getBoundingClientRect(), z = 56, v = 0;
    if (lastY < r.top + z) v = -Math.ceil((r.top + z - lastY) / 6);
    else if (lastY > r.bottom - z) v = Math.ceil((lastY - (r.bottom - z)) / 6);
    if (v){
      var antes = scroller.scrollTop;
      scroller.scrollTop = antes + v;
      var real = scroller.scrollTop - antes;
      if (real){ dragY0 -= real; moveDrag(lastY); }
    }
    requestAnimationFrame(autoScroll);
  }

  function endDrag(){
    dragging = false;
    var li = dragRow; dragRow = null;
    li.classList.remove("drag");
    li.style.transform = "";

    /* el DOM ya quedó en el orden final: se copia a los datos y se guarda */
    var mapa = {}, orden = [], filas = items.querySelectorAll(".item"), i, o;
    var movido = li.querySelector(".item");
    movido = movido ? movido.dataset.id : null;
    for (i=0;i<data.length;i++) mapa[data[i].id] = data[i];
    for (i=0;i<filas.length;i++){
      o = mapa[filas[i].dataset.id];
      if (o) orden.push(o);
    }
    if (orden.length === data.length){
      for (i=0;i<data.length;i++) data[i] = orden[i];
      for (i=0;i<data.length;i++){
        if (data[i].id === movido){    // solo el movido cambia de pos (y de ts)
          var p = posEntre(data[i-1], data[i+1]);
          if (p === null) renumerar();
          else { data[i].pos = p; data[i].ts = Date.now(); }
          break;
        }
      }
      save();
    }
  }

  /* ---------------- borrar + deshacer ---------------- */
  var papelera = null, tmr = null;

  function remove(id){
    for (var i=0;i<data.length;i++){
      if (data[i].id === id){
        papelera = { it: data[i], i: i };
        delMap[id] = Date.now();        // lápida: que no renazca en el otro teléfono
        data.splice(i,1); save();
        setTimeout(render, 170);
        showToast('Borrado "' + papelera.it.t + '"');
        return;
      }
    }
  }
  function showToast(msg){
    toast.querySelector(".m").textContent = msg;
    toast.classList.add("on");
    clearTimeout(tmr);
    tmr = setTimeout(function(){ toast.classList.remove("on"); papelera = null; }, 5000);
  }
  $("#undo").addEventListener("click", function(){
    if (papelera){
      var it = papelera.it, k = Math.min(papelera.i, data.length);
      data.splice(k, 0, it);
      var p = posEntre(data[k-1], data[k+1]);
      if (p === null) renumerar(); else it.pos = p;
      it.ts = Date.now();                // más nuevo que la lápida: revive
      delete delMap[it.id];
      save(); render();
    }
    papelera = null; toast.classList.remove("on"); clearTimeout(tmr);
  });

  /* ---------------- sincronización entre teléfonos (opcional) ----------------
     Solo se activa si abajo hay una URL de Firebase. La lista vive en el
     servidor bajo un código aleatorio largo: quien no lo tenga no puede
     leerla ni adivinarla. Cada teléfono baja lo del servidor, lo empareja
     con lo suyo (por producto gana el ts más nuevo, los borrados dejan
     lápida) y sube solo la diferencia. Sin internet todo sigue local y se
     empareja al reconectar. Tocar la versión muestra el código de la lista
     y permite unirse a la de otro teléfono. */
  var SYNC_URL = "";               // ← pegar aquí la URL de Realtime Database
  try { SYNC_URL = localStorage.getItem("sync.url") || SYNC_URL; } catch(e){}   // solo para pruebas
  SYNC_URL = String(SYNC_URL || "").replace(/\/+$/, "");
  if (!/^https?:\/\//.test(SYNC_URL)) SYNC_URL = "";

  var CODE_KEY = "sync.code", codigo = "";

  function codigoValido(v){ return /^[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$/.test(v); }
  function nuevoCodigo(){
    var abc = "abcdefghjkmnpqrstuvwxyz23456789", s = "", i;
    var buf = new Uint8Array(12);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
    else for (i = 0; i < 12; i++) buf[i] = Math.floor(Math.random() * 256);
    for (i = 0; i < 12; i++) s += abc[buf[i] % abc.length];
    return s.slice(0,4) + "-" + s.slice(4,8) + "-" + s.slice(8);
  }
  if (SYNC_URL){
    try { codigo = localStorage.getItem(CODE_KEY) || ""; } catch(e){}
    if (!codigoValido(codigo)){
      codigo = nuevoCodigo();
      try { localStorage.setItem(CODE_KEY, codigo); } catch(e){}
    }
  }

  function urlTab(t){ return SYNC_URL + "/listas/" + codigo + "/" + t + ".json"; }

  /* empareja una pestaña con lo remoto; devuelve lo que falta subir (o null) */
  function mergeTab(t, remoto){
    var L = listas[t], i, id;
    var rem = (remoto && typeof remoto === "object") ? remoto : {};
    var rItems = (rem.items && typeof rem.items === "object" && !Array.isArray(rem.items)) ? rem.items : {};
    var rDel = sanearDel(rem.del);
    var loc = {}, subir = {}, cambioLocal = false;

    for (i = 0; i < L.items.length; i++) loc[L.items[i].id] = L.items[i];

    /* items: por id gana el ts más nuevo */
    var ids = {}, res = {};
    for (id in loc) ids[id] = 1;
    for (id in rItems) ids[id] = 1;
    for (id in ids){
      var a = loc[id] || null, b = null, rb = rItems[id];
      if (rb && typeof rb === "object"){
        var tt = limpiarTexto(rb.t), ts = sanearNum(rb.ts), pos = sanearNum(rb.pos);
        if (tt && ts !== null) b = { id: id, t: tt, ts: ts, pos: pos === null ? 0 : pos };
      }
      var gana = !a ? b : (!b ? a : (b.ts > a.ts ? b : a));
      if (!gana) continue;
      res[id] = gana;
      if (gana === a && (!b || b.ts < a.ts)) subir["items/" + id] = { t: a.t, ts: a.ts, pos: a.pos };
      else if (gana === b) cambioLocal = true;
    }

    /* lápidas: también gana la más nueva */
    var del = {};
    for (id in L.del) del[id] = L.del[id];
    for (id in rDel){
      if (!(id in del) || rDel[id] > del[id]){ del[id] = rDel[id]; cambioLocal = true; }
    }
    for (id in L.del){
      if (!(id in rDel) || L.del[id] > rDel[id]) subir["del/" + id] = L.del[id];
    }

    /* lápida contra producto: si la lápida es más nueva, sigue borrado */
    var vivos = [];
    for (id in res){
      if (id in del){
        if (del[id] >= res[id].ts){ if (loc[id]) cambioLocal = true; continue; }
        delete del[id];                  // el producto renació: la lápida sobra
        if (("del/" + id) in subir) delete subir["del/" + id];
        if (id in rDel) subir["del/" + id] = null;
      }
      vivos.push(res[id]);
    }
    /* lápidas de más de 30 días: ya cumplieron, se limpian de los dos lados */
    var VIEJA = Date.now() - 30 * 24 * 3600 * 1000;
    for (id in del){
      if (del[id] < VIEJA){
        delete del[id];
        if (("del/" + id) in subir) delete subir["del/" + id];
        if (id in rDel) subir["del/" + id] = null;
        if (id in rItems) subir["items/" + id] = null;
      }
    }

    vivos.sort(function(x, y){ return (x.pos - y.pos) || (y.ts - x.ts) || (x.id < y.id ? -1 : 1); });
    L.items.length = 0;
    for (i = 0; i < vivos.length; i++) L.items.push(vivos[i]);
    for (id in L.del) delete L.del[id];
    for (id in del) L.del[id] = del[id];
    guardarTab(t);
    if (cambioLocal && t === activa) render();
    for (id in subir) return subir;
    return null;
  }

  var syncTmr = null, subiendo = false;

  function syncTab(t, cb){
    fetch(urlTab(t)).then(function(r){
      if (!r.ok) throw 0;
      return r.json();
    }).then(function(remoto){
      var subir = mergeTab(t, remoto);
      if (subir) return fetch(urlTab(t), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(subir)
      });
    }).then(function(){ cb(); })["catch"](function(){ cb(); });
  }

  function syncAll(){
    if (!SYNC_URL) return;
    if (subiendo || dragging){ pedirSync(); return; }   // ocupado: se reintenta solo
    subiendo = true;
    var falta = 3;
    ["lista","pedidos","web"].forEach(function(t){
      syncTab(t, function(){ if (--falta === 0) subiendo = false; });
    });
  }

  function pedirSync(){
    if (!SYNC_URL) return;
    clearTimeout(syncTmr);
    syncTmr = setTimeout(syncAll, 500);
  }

  /* stream en vivo: Firebase avisa cuando el otro teléfono cambia algo */
  var es = null, esTab = "", esEspera = 1000, esTmr = null;

  function abrirStream(){
    if (!SYNC_URL || !window.EventSource) return;
    if (es && esTab === activa) return;
    cerrarStream();
    esTab = activa;
    try { es = new EventSource(urlTab(activa)); } catch(e){ es = null; esTab = ""; return; }
    var avisa = function(){ esEspera = 1000; pedirSync(); };
    es.addEventListener("put", avisa);
    es.addEventListener("patch", avisa);
    es.onerror = function(){                 // sin internet: reintenta con calma
      cerrarStream();
      clearTimeout(esTmr);
      esTmr = setTimeout(abrirStream, esEspera);
      esEspera = Math.min(esEspera * 2, 60000);
    };
  }
  function cerrarStream(){
    if (es){ try { es.close(); } catch(e){} es = null; esTab = ""; }
  }

  /* tocar la versión: ver el código de esta lista o unirse a otra */
  $("#ver").addEventListener("click", function(){
    if (!SYNC_URL) return;
    var v = prompt(
      "Sincronización entre teléfonos\n\n" +
      "El código de ESTA lista es:\n\n      " + codigo + "\n\n" +
      "En el otro teléfono, toca la versión y escribe ese código.\n" +
      "Para unirte tú a otra lista, escribe aquí su código:", ""
    );
    if (v == null) return;
    v = v.toLowerCase().replace(/[^a-z0-9-]/g, "");
    if (!v) return;
    if (!codigoValido(v)){ alert("Ese código no se ve bien.\nFormato: xxxx-xxxx-xxxx"); return; }
    if (v === codigo) return;
    codigo = v;
    try { localStorage.setItem(CODE_KEY, codigo); } catch(e){}
    cerrarStream(); abrirStream(); pedirSync();
    showToast("Unido a la lista " + codigo);
  });

  /* ---------------- compartir / respaldo ---------------- */
  $("#share").addEventListener("click", function(){
    if (!data.length) return;
    var txt = data.map(function(it){ return "• " + it.t; }).join("\n");
    if (navigator.share) navigator.share({ title: cfg.titulo, text: cfg.titulo + "\n" + txt })["catch"](function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ showToast("Copiado"); });
  });

  /* ---------------- teclado: que nunca tape la lista ---------------- */
  var vv = window.visualViewport;
  if (vv){
    var sync = function(){
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty("--kb", kb + "px");
      if (window.scrollY !== 0) window.scrollTo(0,0);
    };
    vv.addEventListener("resize", sync);
    vv.addEventListener("scroll", sync);
    sync();
  }
  window.addEventListener("scroll", function(){ if (window.scrollY !== 0) window.scrollTo(0,0); });

  /* ---------------- pantalla trabada en su escala ----------------
     Safari en iPhone ignora "user-scalable=no", así que además hay que
     cancelar el gesto de pellizco a mano. Con esto la pantalla ya no se
     agranda sola ni queda todo corrido. */
  ["gesturestart","gesturechange","gestureend"].forEach(function(g){
    document.addEventListener(g, function(ev){ ev.preventDefault(); }, {passive:false});
  });
  /* Ojo: no bloquear el doble toque desde touchend — se comería los gestos
     rápidos seguidos al ir borrando varios productos. Con touch-action
     "manipulation" ya alcanza. */

  verPestana(activa);

  if (SYNC_URL){
    window.addEventListener("online", pedirSync);
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) cerrarStream();
      else { abrirStream(); pedirSync(); }   // al volver a la app, se empareja
    });
    pedirSync();
  }

  /* ---------------- service worker (offline) ---------------- */
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
